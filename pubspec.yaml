name: moe_flutter_templates
description: Starter project template for MOE Flutter applications.
version: 1.0.0
publish_to: none
repository: https://github.com/mindofemanizer/MOE-Flutter-Templates

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.7.0
  moe_flutter_foundation:
    git:
      url: https://github.com/mindofemanizer/MOE-Flutter-Foundation.git
      ref: v1.0.0
  moe_flutter_commerce:
    git:
      url: https://github.com/mindofemanizer/MOE-Flutter-Commerce.git
      ref: v1.0.0
  moe_flutter_payment:
    git:
      url: https://github.com/mindofemanizer/MOE-Flutter-Payment.git
      ref: v1.0.0
  moe_flutter_inventory:
    git:
      url: https://github.com/mindofemanizer/MOE-Flutter-Inventory.git
      ref: v1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

topics:
  - starter
  - template
  - example
